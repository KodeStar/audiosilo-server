# GoReleaser config for AudioSilo native distribution.
#
# Produces self-contained, cross-platform binaries on each `v*` tag (see
# .github/workflows/release.yml) so non-Docker home users can download one file
# and run it. The Linux binaries build the native C SQLite engine in (the store's
# sqlite_native engine, see SQLite in CONVENTIONS.md), linked statically against
# glibc exactly as the Docker image's build stage does: one static binary that
# runs on any distro, Alpine included (the LinuxServer.io image downloads these
# tarballs), with glibc's allocator rather than musl's. macOS and Windows stay
# CGO-free (modernc's pure-Go engine), so they cross-compile with no C toolchain.
#
# Self-contained where it's cheap: the admin console (admin-ui/) is always
# embedded (built by a before-hook), and the web player is embedded via `-tags
# embedplayer` (scripts/fetch-web-player.sh populates internal/web/player/ from the
# pinned web image before building). ffmpeg/ffprobe are NOT bundled - they're often
# already installed and large, so the server prefers a local copy (PATH or next to
# the binary) and otherwise fetches one on demand into the data dir (see
# pkg/launcher). This keeps the download small.
#
# The Docker image keeps its own pipeline (Dockerfile + image.yml); this is purely
# the native-binary path. Validate locally with:
#   goreleaser check
#   goreleaser build --snapshot --clean --skip=before --single-target
# (a Linux target needs its C compiler: x86_64-linux-gnu-gcc / aarch64-linux-gnu-gcc).
version: 2

project_name: audiosilo

before:
  hooks:
    # CI-only (needs network + the pinned web image). Skip locally with --skip=before;
    # the committed internal/web/player/.gitkeep keeps -tags embedplayer compiling.
    - ./scripts/fetch-web-player.sh
    # The admin console (admin-ui/ -> internal/web/adminui/dist, embedded). Needs
    # Node 24 (release.yml sets it up). Without it the binary serves a "console
    # not built" page at /admin, so it must run before every release build.
    - ./scripts/build-admin.sh --build-only

builds:
  # Linux: the native SQLite engine, static against glibc (the Dockerfile's
  # recipe). netgo and osusergo keep the static binary off glibc's NSS, and
  # sqlite_omit_load_extension off dlopen. CC names each target's compiler by its
  # triplet, so either architecture can be the host (on Debian/Ubuntu the other
  # one comes from gcc-<triplet> + libc6-dev-<arch>-cross).
  - id: audiosilo-linux
    main: ./cmd/audiosilo
    binary: audiosilo
    env:
      - CGO_ENABLED=1
      - 'CC={{ if eq .Arch "arm64" }}aarch64-linux-gnu-gcc{{ else }}x86_64-linux-gnu-gcc{{ end }}'
    flags:
      - -trimpath
      - -tags=embedplayer,sqlite_native,sqlite_fts5,sqlite_preupdate_hook,sqlite_omit_load_extension,netgo,osusergo
    ldflags:
      - &version_ldflags -s -w -X github.com/kodestar/audiosilo-server/internal/api.Version={{ .Version }}
      - -linkmode external -extldflags -static
    goos: [linux]
    goarch: [amd64, arm64]

  # macOS and Windows: pure Go (modernc's engine), no C toolchain.
  - id: audiosilo
    main: ./cmd/audiosilo
    binary: audiosilo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=embedplayer
    ldflags:
      - *version_ldflags
    goos: [darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: native
    ids: [audiosilo-linux, audiosilo]
    name_template: "audiosilo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Windows users expect a .zip; everyone else a .tar.gz.
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - RELEASING.md

# Linux .deb/.rpm: depend on the distro's ffmpeg rather than bundling, and install
# a systemd unit. Home users on Linux who'd rather not use a package can take the
# tarball above instead (ffmpeg is found locally or auto-downloaded on first use).
nfpms:
  - id: linux-packages
    ids: [audiosilo-linux]
    package_name: audiosilo
    vendor: AudioSilo
    homepage: https://github.com/kodestar/audiosilo-server
    maintainer: AudioSilo <noreply@audiosilo.app>
    description: Self-hosted audiobook server (JSON API + admin UI + web player).
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    dependencies:
      - ffmpeg
    contents:
      - src: packaging/systemd/audiosilo.service
        dst: /lib/systemd/system/audiosilo.service
        type: config

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: KodeStar
    name: audiosilo-server
  draft: true # let a human review the release notes/artifacts before publishing
  footer: |
    ---
    Native builds embed the web player; ffmpeg/ffprobe are found locally or
    auto-downloaded on first use. Prefer Docker for advanced / multi-user
    setups: `ghcr.io/kodestar/audiosilo-server`.

    AudioSilo is free; sponsors keep it going:
    [GitHub Sponsors](https://github.com/sponsors/KodeStar).
