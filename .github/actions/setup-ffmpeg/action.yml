# A static ffmpeg/ffprobe on PATH for the scanner tests (they t.Skip without
# ffprobe). Pinned to a BtbN month-end build (those are kept long term) of the
# FFmpeg release the Docker image's Alpine ships, so the in-process probe runs
# on known rules, as in the image. To bump: pick a month-end autobuild of the
# image's release and update BUILD, the cache key and SHA256 together.
name: setup-ffmpeg
description: Put a pinned static ffmpeg and ffprobe on PATH.
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v6
      with:
        path: ~/.ffmpeg-static
        key: ffmpeg-static-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAG: autobuild-2026-10-31-12-59
        BUILD: ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1
        SHA256: 41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
      run: |
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
          "https://github.com/BtbN/FFmpeg-Builds/releases/download/$TAG/$BUILD.tar.xz"
        echo "$SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
        mkdir -p ~/.ffmpeg-static
        tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C ~/.ffmpeg-static --strip-components=2 \
          "$BUILD/bin/ffmpeg" "$BUILD/bin/ffprobe"

    - shell: bash
      run: |
        echo "$HOME/.ffmpeg-static" >> "$GITHUB_PATH"
        "$HOME/.ffmpeg-static/ffprobe" -version | head -1
