# A static ffmpeg/ffprobe on PATH for the scanner tests (they t.Skip without
# ffprobe). Pinned to a BtbN month-end build (those are kept long term) of the
# FFmpeg release the Docker image's Alpine ships, so the in-process probe runs
# on known rules, as in the image; the lgpl variant, as internal/toolfetch
# downloads (its btbnBranch names the same release). To bump: pick a month-end
# autobuild of the image's release and update the three defaults below (the
# cache key follows sha256).
name: setup-ffmpeg
description: Put a pinned static ffmpeg and ffprobe on PATH.
inputs:
  tag:
    description: BtbN FFmpeg-Builds release tag.
    default: autobuild-2026-10-31-12-59
  build:
    description: Asset name without .tar.xz (also its top-level folder).
    default: ffmpeg-n8.1.3-27-g8dca1586f4-linux64-lgpl-8.1
  sha256:
    description: SHA-256 of the asset.
    default: a64f3171e6ad1f7d358d28890a907ee478c331d1177ec696a93418f79ac3f1f3
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v6
      with:
        path: ~/.ffmpeg-static
        key: ffmpeg-static-${{ inputs.sha256 }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        BUILD: ${{ inputs.build }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
          "https://github.com/BtbN/FFmpeg-Builds/releases/download/$TAG/$BUILD.tar.xz"
        echo "$SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
        mkdir -p ~/.ffmpeg-static
        tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C ~/.ffmpeg-static --strip-components=2 \
          "$BUILD/bin/ffmpeg" "$BUILD/bin/ffprobe"

    - shell: bash
      run: |
        echo "$HOME/.ffmpeg-static" >> "$GITHUB_PATH"
        "$HOME/.ffmpeg-static/ffprobe" -version | head -1
