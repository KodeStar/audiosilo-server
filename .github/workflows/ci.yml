# Gates every pull request and push to main on tests + coverage, race tests and
# lint on the native SQLite engine the image ships, lint (govet included), plus
# the admin console's own gate (admin-ui: typecheck, lint, prettier, vitest).
# The four jobs run side by side; the image build (image.yml) stays separate
# and runs on tags (releases) and pushes to main (:edge).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The admin console (admin-ui/) is built BEFORE the Go steps, so the embed
      # tests (internal/web/adminui) run against a real build instead of skipping.
      # Its build output is embedded, never committed.
      - uses: actions/setup-node@v7
        with:
          node-version-file: admin-ui/.nvmrc
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Admin console (install, vite build)
        run: scripts/build-admin.sh --vite-only

      # ffprobe powers the duration/embedded-chapter scanner tests; without it
      # those tests t.Skip (the suite still passes), so install it to keep them live.
      - name: Install ffmpeg (ffprobe)
        uses: ./.github/actions/setup-ffmpeg

      # No separate build or vet step: -coverprofile compiles every package,
      # test files or not, and the lint job runs govet. No -race here: on the
      # pure-Go engine it instruments the transpiled SQLite and is several times
      # slower; test-native runs the same suite with -race.
      - name: Test (coverage)
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  # The Docker image ships the native SQLite engine (-tags sqlite_native, cgo):
  # its files build only under those tags, so race test and lint them here (the
  # lint step runs govet), the whole suite on that engine. TestNativeFastRows
  # fails here when a mattn upgrade drops the statement field the fast path
  # reads. (No admin console build: the embed tests skip here and run in the
  # test job.)
  test-native:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      TAGS: sqlite_native sqlite_fts5 sqlite_preupdate_hook
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ffmpeg (ffprobe)
        uses: ./.github/actions/setup-ffmpeg

      - name: Test (native engine, race)
        run: go test -race -tags "$TAGS" ./...

      - name: Lint (native engine)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --build-tags=sqlite_native,sqlite_fts5,sqlite_preupdate_hook

  admin-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: admin-ui/.nvmrc
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      # The build fails on any CSP violation.
      - name: Admin console (install, check, build)
        run: scripts/build-admin.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint-action@v9 installs golangci-lint v2 (required since Go 1.25)
      # and manages its own cache; config is .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
