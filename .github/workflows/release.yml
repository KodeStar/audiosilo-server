# Native binary release (GoReleaser). On each v* tag this builds self-contained,
# cross-platform binaries for home users who don't want Docker: the web player is
# embedded (-tags embedplayer, populated from the pinned web image) and ffmpeg +
# ffprobe are bundled beside the binary. Outputs archives, .deb/.rpm and checksums
# to a DRAFT GitHub Release for review before publishing.
#
# This is independent of the Docker image pipeline (image.yml) — both can run on
# the same tag. Publish the web image first (frontend → audiosilo-web) so the
# embedded player matches, exactly as for the Docker build.
name: release (native binaries)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      web_version:
        description: web player image tag to embed (default latest)
        default: latest

permissions:
  contents: write # create the GitHub Release + upload assets
  packages: read # pull the web image from GHCR for the embedded player

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # GHCR refs must be lowercase; the owner login can be mixed-case.
      - name: Resolve owner (lowercase)
        id: owner
        run: echo "lc=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GHCR (to pull the web image for the embedded player)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # scripts/fetch-web-player.sh pulls this and bakes it in via -tags embedplayer.
          WEB_IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/audiosilo-web:${{ github.event.inputs.web_version || 'latest' }}
