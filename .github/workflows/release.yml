# Native binary release (GoReleaser). On each v* tag this builds self-contained,
# cross-platform binaries for home users who don't want Docker: the web player is
# embedded (-tags embedplayer, populated from the pinned web image). ffmpeg +
# ffprobe are NOT bundled - the launcher finds a local copy or auto-downloads a
# cached build on first use (internal/toolfetch). Outputs archives, .deb/.rpm and
# checksums to a DRAFT GitHub Release for review before publishing.
#
# This is independent of the Docker image pipeline (image.yml) - both can run on
# the same tag. Publish the web image first (frontend → audiosilo-web) so the
# embedded player matches, exactly as for the Docker build.
name: release (native binaries)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      web_version:
        description: web player image tag to embed (default latest)
        default: latest

permissions:
  contents: write # create the GitHub Release + upload assets
  packages: read # pull the web image from GHCR for the embedded player

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The GoReleaser before-hook builds the admin console (admin-ui/) to embed.
      - uses: actions/setup-node@v7
        with:
          node-version-file: admin-ui/.nvmrc
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      # GHCR refs must be lowercase; the owner login can be mixed-case.
      - name: Resolve owner (lowercase)
        id: owner
        run: echo "lc=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GHCR (to pull the web image for the embedded player)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # scripts/fetch-web-player.sh pulls this and bakes it in via -tags embedplayer.
          WEB_IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/audiosilo-web:${{ github.event.inputs.web_version || 'latest' }}

      # Smoke-test the native archives while the release is still a draft. The
      # LinuxServer.io image depends on their exact names, layout, static linking
      # and embedded player, and runs the binary with only --data (RELEASING.md 2c).
      - name: Smoke-test the native archives
        run: |
          set -euo pipefail
          # Their Dockerfile fetches audiosilo_<tag without v>_linux_<arch>.tar.gz.
          version=$(jq -r .tag dist/metadata.json)
          version=${version#v}
          for arch in amd64 arm64; do
            dir="$RUNNER_TEMP/smoke/$arch"
            mkdir -p "$dir"
            tar xzf "dist/audiosilo_${version}_linux_${arch}.tar.gz" -C "$dir" audiosilo
            info=$(go version -m "$dir/audiosilo")
            for want in -tags=embedplayer CGO_ENABLED=0 "GOARCH=$arch"; do
              grep -qw -- "$want" <<<"$info"
            done
          done
          # Boot amd64 as their image does: --data only, so the headless first run
          # and the self-signed TLS default. Its one-time credentials banner (stdout)
          # stays out of the log; ffmpeg/ffprobe are off so nothing downloads.
          AUDIOSILO_BIND=127.0.0.1:18080 AUDIOSILO_UPDATE_CHECK=false \
            "$RUNNER_TEMP/smoke/amd64/audiosilo" --data "$RUNNER_TEMP/smoke/data" --ffprobe "" --ffmpeg "" > /dev/null &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl -kfsS --retry 30 --retry-delay 1 --retry-connrefused https://127.0.0.1:18080/healthz
          curl -kfsSL https://127.0.0.1:18080/web/ | grep -i '<html' > /dev/null
