# Builds the server image (server binary + a pinned web player baked in at
# /app/web) and pushes it to ghcr.io/<owner>/audiosilo-server. Publish the web
# image first (audiosilo-frontend → ghcr.io/<owner>/audiosilo-web), since this
# build pulls it via COPY --from.
#
# A v* tag publishes the release (:<version> and :latest). Every push to main
# publishes :edge (plus sha-<short>), an unreleased build for testing main
# before a release; it never moves :latest.
name: server image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      web_version:
        description: web player image tag to bake in
        default: latest

permissions:
  contents: read
  packages: write

# Quick successive pushes to main supersede each other rather than racing to
# publish :edge. Each release tag is its own ref, so tag builds are unaffected.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # GHCR image references must be lowercase; the owner login can be mixed-case.
      - name: Resolve owner (lowercase)
        id: owner
        run: echo "lc=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/audiosilo-server
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
            # :edge tracks the head of main (push or dispatch on main).
            type=edge,branch=main
            # Only a real release (a v* tag) may move the public :latest - a
            # workflow_dispatch from a feature branch must not republish it.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # VERSION: on a tag build stamp the semver version; off a tag (main
          # pushes and dispatch) the metadata version would resolve to "edge" or
          # a branch name, so fall back to a dev-<sha> marker instead. (These are
          # YAML comments on purpose: build-push-action has no comment syntax, so
          # a "#" line inside the build-args literal would become a build arg.)
          build-args: |
            WEB_IMAGE=ghcr.io/${{ steps.owner.outputs.lc }}/audiosilo-web:${{ github.event.inputs.web_version || 'latest' }}
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && steps.meta.outputs.version || format('dev-{0}', github.sha) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
