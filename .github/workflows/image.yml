# Builds the server image (server binary + a pinned web player baked in at
# /app/web) and pushes it to ghcr.io/<owner>/audiosilo-server. Publish the web
# image first (audiosilo-frontend → ghcr.io/<owner>/audiosilo-web), since this
# build pulls it via COPY --from.
name: server image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      web_version:
        description: web player image tag to bake in
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/audiosilo-server
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/audiosilo-web:${{ github.event.inputs.web_version || 'latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
