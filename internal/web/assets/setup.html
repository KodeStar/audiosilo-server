<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AudioSilo - Setup</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <script src="/assets/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <!-- First-run setup wizard. Served only until an admin exists, and POST is
       token-guarded. All behaviour lives in /assets/setup.js (strict CSP). -->
  <div class="center">
    <div class="column">
      <div class="brand">
        <span class="tile"><span class="mark"></span></span>
        <span class="wordmark">AudioSilo</span>
      </div>
      <div class="card">
        <h1>Welcome - let's set up your server</h1>
        <p class="muted">Create the account you will use to sign in to the admin console.</p>

        <form id="setup-form">
          <div class="field">
            <label for="username">Admin username</label>
            <input id="username" value="admin" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Admin password</label>
            <input id="password" type="password" autocomplete="new-password" minlength="8" required>
            <p class="muted">At least 8 characters - you'll sign in with this.</p>
          </div>
          <button type="submit" class="block" id="setup-submit">Create account</button>
        </form>
        <div id="setup-msg" class="msg" role="alert"></div>

        <div id="setup-done" class="hidden">
          <h2>Your account is ready</h2>
          <p class="muted">Sign in to the admin console with the username and password you just chose.</p>
          <div class="inline">
            <a class="button" href="/admin">Open admin console</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/assets/setup.js"></script>
</body>
</html>
